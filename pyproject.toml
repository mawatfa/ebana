[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebana"
version = "0.1.0"
description = "Energy-Based Analog Neural Network Framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohamed Watfa", email = "medwatt@hotmail.com" }]
dependencies = [
    "numpy>=1.24",
    "pycircuitsim @ git+https://github.com/medwatt/PyCircuitSim.git",
]

[project.optional-dependencies]
examples = ["scikit-learn", "optuna"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/mawatfa/ebana"

[tool.setuptools.packages.find]
include = ["ebana*"]
